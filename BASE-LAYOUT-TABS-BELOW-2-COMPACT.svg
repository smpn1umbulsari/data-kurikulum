<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120">
  <defs>
    <style>
      .bg{fill:#f6f8fb}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.4}.strong{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.muted{fill:#f1f5f9}.text{fill:#0f172a;font-family:Inter,Segoe UI,Arial,sans-serif}.sec{fill:#334155;font-family:Inter,Segoe UI,Arial,sans-serif}.hint{fill:#64748b;font-family:Inter,Segoe UI,Arial,sans-serif}.accent{fill:#0369a1}.soft{fill:#e0f2fe}.primary{fill:#1d4ed8}.title{font-size:30px;font-weight:850}.label{font-size:13px;font-weight:850;letter-spacing:.08em}.body{font-size:16px;font-weight:750}.small{font-size:13px;font-weight:700}.shadow{filter:url(#s)}
    </style>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity=".07"/></filter>
  </defs>
  <rect class="bg" width="1440" height="1120"/>
  <text x="72" y="64" class="text title">Layout 2: Tabs Below - Compact Toolbar</text>
  <text x="72" y="94" class="hint body">Tab tetap di bawah header, action dan filter dipadatkan dalam satu band.</text>

  <g transform="translate(72 130)">
    <rect width="1296" height="104" rx="8" class="panel shadow"/><rect width="5" height="104" rx="3" fill="#0369a1"/>
    <text x="30" y="38" class="accent label">AKADEMIK</text><text x="30" y="76" class="text title">Judul Modul</text><text x="1010" y="60" class="hint small">Header bersih</text>
  </g>

  <g transform="translate(72 252)">
    <rect width="1296" height="58" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <rect x="24" y="12" width="142" height="34" rx="7" class="soft" stroke="#0369a1"/><text x="58" y="34" class="accent small">Tab Aktif</text>
    <rect x="178" y="12" width="142" height="34" rx="7" fill="#fff" stroke="#cbd5e1"/><text x="214" y="34" class="sec small">Tab Kedua</text>
    <rect x="332" y="12" width="142" height="34" rx="7" fill="#fff" stroke="#cbd5e1"/><text x="368" y="34" class="sec small">Tab Ketiga</text>
  </g>

  <g transform="translate(72 328)">
    <rect width="1296" height="140" rx="8" class="panel shadow"/>
    <g transform="translate(24 22)"><rect width="128" height="34" rx="7" class="primary"/><text x="30" y="23" fill="#fff" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="800">Aksi Utama</text><rect x="144" width="96" height="34" rx="7" fill="#fff" stroke="#94a3b8"/><text x="172" y="23" class="sec small">Import</text><rect x="252" width="96" height="34" rx="7" fill="#fff" stroke="#94a3b8"/><text x="280" y="23" class="sec small">Reset</text><rect x="360" width="96" height="34" rx="7" fill="#fff" stroke="#94a3b8"/><text x="384" y="23" class="sec small">Refresh</text></g>
    <g transform="translate(24 78)"><rect width="520" height="40" rx="7" fill="#fff" stroke="#94a3b8"/><text x="16" y="26" class="hint small">Cari data...</text><rect x="544" width="210" height="40" rx="7" fill="#fff" stroke="#94a3b8"/><text x="560" y="26" class="sec small">Filter 1</text><rect x="766" width="210" height="40" rx="7" fill="#fff" stroke="#94a3b8"/><text x="782" y="26" class="sec small">Filter 2</text><rect x="988" width="236" height="40" rx="7" fill="#fff" stroke="#94a3b8"/><text x="1004" y="26" class="sec small">Filter 3</text></g>
  </g>

  <g transform="translate(72 492)"><rect width="1296" height="54" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="24" y="34" class="text body">128 data</text><text x="1050" y="34" class="hint small">Rows per page: 10</text></g>

  <g transform="translate(72 570)">
    <rect width="1296" height="454" rx="8" class="strong shadow"/><rect width="1296" height="52" rx="8" class="muted"/><line x1="0" y1="52" x2="1296" y2="52" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="28" y="33" class="sec small">Kolom 1</text><text x="230" y="33" class="sec small">Kolom 2</text><text x="470" y="33" class="sec small">Deskripsi</text><text x="960" y="33" class="sec small">Status</text><text x="1160" y="33" class="sec small">Aksi</text>
    <g transform="translate(0 52)"><rect width="1296" height="60" fill="#fff"/><text x="28" y="37" class="text small">001</text><text x="230" y="37" class="text small">Kode</text><text x="470" y="37" class="text small">Workspace lebih cepat terlihat</text><rect x="950" y="17" width="90" height="26" rx="13" fill="#e0f2fe" stroke="#7dd3fc"/><text x="972" y="35" fill="#0369a1" font-family="Inter,Segoe UI,Arial" font-size="12" font-weight="800">Aktif</text></g>
    <g transform="translate(0 112)"><rect width="1296" height="60" fill="#f8fafc"/><text x="28" y="37" class="text small">002</text><text x="230" y="37" class="text small">Kode</text><text x="470" y="37" class="text small">Action dan filter berada dalam satu band</text><rect x="950" y="17" width="90" height="26" rx="13" fill="#dcfce7" stroke="#86efac"/><text x="974" y="35" fill="#15803d" font-family="Inter,Segoe UI,Arial" font-size="12" font-weight="800">OK</text></g>
  </g>
</svg>

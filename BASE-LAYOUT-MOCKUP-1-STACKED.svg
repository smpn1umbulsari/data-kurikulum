<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120">
  <defs>
    <style>
      .bg{fill:#f6f8fb}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.4}.strong{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.muted{fill:#f1f5f9}.text{fill:#0f172a;font-family:Inter,Segoe UI,Arial,sans-serif}.sec{fill:#334155;font-family:Inter,Segoe UI,Arial,sans-serif}.hint{fill:#64748b;font-family:Inter,Segoe UI,Arial,sans-serif}.accent{fill:#0f766e}.soft{fill:#ccfbf1}.primary{fill:#1d4ed8}.title{font-size:30px;font-weight:850}.label{font-size:13px;font-weight:850;letter-spacing:.08em}.body{font-size:16px;font-weight:750}.small{font-size:13px;font-weight:700}.tiny{font-size:12px;font-weight:650}.shadow{filter:url(#s)}
    </style>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity=".07"/></filter>
  </defs>
  <rect class="bg" width="1440" height="1120"/>
  <text x="72" y="64" class="text title">Rekomendasi 1: Stacked Data Shell</text>
  <text x="72" y="94" class="hint body">Default paling aman untuk semua modul data: header, tombol cepat, filter, info, workspace.</text>

  <g transform="translate(72 130)">
    <rect width="1296" height="120" rx="8" class="panel shadow"/><rect width="5" height="120" rx="3" fill="#0f766e"/>
    <text x="30" y="38" class="accent label">AKADEMIK</text><text x="30" y="76" class="text title">Judul Modul</text>
    <g transform="translate(930 35)"><rect width="150" height="42" rx="7" class="soft" stroke="#0f766e"/><text x="42" y="27" class="accent body">Tab Aktif</text><rect x="162" width="150" height="42" rx="7" fill="#fff" stroke="#cbd5e1"/><text x="203" y="27" class="sec body">Tab Lain</text></g>
  </g>

  <g transform="translate(72 274)">
    <rect width="1296" height="92" rx="8" class="panel"/><text x="24" y="31" class="sec small">Action Bar</text>
    <g transform="translate(24 45)"><rect width="130" height="34" rx="7" class="primary"/><text x="31" y="23" fill="#fff" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="800">Aksi Utama</text><rect x="146" width="110" height="34" rx="7" fill="#fff" stroke="#94a3b8"/><text x="178" y="23" class="sec small">Aksi 1</text><rect x="268" width="110" height="34" rx="7" fill="#fff" stroke="#94a3b8"/><text x="300" y="23" class="sec small">Aksi 2</text><rect x="390" width="110" height="34" rx="7" fill="#fff" stroke="#94a3b8"/><text x="422" y="23" class="sec small">Reset</text><rect x="512" width="110" height="34" rx="7" fill="#fff" stroke="#94a3b8"/><text x="538" y="23" class="sec small">Refresh</text></g>
  </g>

  <g transform="translate(72 390)">
    <rect width="1296" height="130" rx="8" class="panel"/><text x="24" y="31" class="sec small">Control Panel</text>
    <g transform="translate(24 52)"><g><text y="0" class="hint tiny">Pencarian</text><rect y="12" width="440" height="44" rx="7" fill="#fff" stroke="#94a3b8"/><text x="16" y="40" class="hint small">Cari data...</text></g><g transform="translate(464)"><text y="0" class="hint tiny">Filter 1</text><rect y="12" width="230" height="44" rx="7" fill="#fff" stroke="#94a3b8"/></g><g transform="translate(718)"><text y="0" class="hint tiny">Filter 2</text><rect y="12" width="230" height="44" rx="7" fill="#fff" stroke="#94a3b8"/></g><g transform="translate(972)"><text y="0" class="hint tiny">Filter 3</text><rect y="12" width="252" height="44" rx="7" fill="#fff" stroke="#94a3b8"/></g></g>
  </g>

  <g transform="translate(72 544)"><rect width="1296" height="66" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="24" y="41" class="text body">128 data</text><text x="1030" y="41" class="hint small">Rows per page</text><rect x="1144" y="16" width="120" height="34" rx="7" fill="#fff" stroke="#94a3b8"/><text x="1194" y="38" class="sec small">10</text></g>

  <g transform="translate(72 634)">
    <rect width="1296" height="390" rx="8" class="strong shadow"/><rect width="1296" height="52" rx="8" class="muted"/><line x1="0" y1="52" x2="1296" y2="52" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="28" y="33" class="sec small">Kolom 1</text><text x="210" y="33" class="sec small">Kolom 2</text><text x="430" y="33" class="sec small">Nama / Deskripsi</text><text x="860" y="33" class="sec small">Status</text><text x="1130" y="33" class="sec small">Aksi</text>
    <g transform="translate(0 52)"><rect width="1296" height="56" fill="#fff"/><text x="28" y="35" class="text small">001</text><text x="210" y="35" class="text small">Kode Data</text><text x="430" y="35" class="text small">Contoh baris data utama</text><rect x="850" y="16" width="90" height="26" rx="13" fill="#dcfce7" stroke="#86efac"/><text x="874" y="34" fill="#15803d" font-family="Inter,Segoe UI,Arial" font-size="12" font-weight="800">Aktif</text><circle cx="1148" cy="28" r="15" fill="#fff" stroke="#94a3b8"/><circle cx="1190" cy="28" r="15" fill="#fee2e2" stroke="#fca5a5"/><line x1="0" y1="56" x2="1296" y2="56" stroke="#e2e8f0"/></g>
    <g transform="translate(0 108)"><rect width="1296" height="56" fill="#f8fafc"/><text x="28" y="35" class="text small">002</text><text x="210" y="35" class="text small">Kode Data</text><text x="430" y="35" class="text small">Contoh baris data kedua</text><rect x="850" y="16" width="90" height="26" rx="13" fill="#fef3c7" stroke="#fcd34d"/><text x="872" y="34" fill="#b45309" font-family="Inter,Segoe UI,Arial" font-size="12" font-weight="800">Draft</text><circle cx="1148" cy="28" r="15" fill="#fff" stroke="#94a3b8"/><circle cx="1190" cy="28" r="15" fill="#fee2e2" stroke="#fca5a5"/><line x1="0" y1="56" x2="1296" y2="56" stroke="#e2e8f0"/></g>
    <g transform="translate(0 310)"><line x1="0" y1="0" x2="1296" y2="0" stroke="#cbd5e1"/><rect x="1030" y="24" width="72" height="34" rx="7" fill="#fff" stroke="#cbd5e1"/><text x="1054" y="46" class="hint small">Prev</text><text x="1124" y="46" class="hint small">Halaman 1 dari 8</text><rect x="1230" y="24" width="54" height="34" rx="7" fill="#fff" stroke="#cbd5e1"/><text x="1246" y="46" class="hint small">Next</text></g>
  </g>
</svg>

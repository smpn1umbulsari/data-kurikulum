<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080">
  <defs>
    <style>
      .bg{fill:#f6f8fb}
      .panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.4}
      .panel2{fill:#f8fafc;stroke:#dbe4ee;stroke-width:1.2}
      .line{stroke:#e2e8f0;stroke-width:1.4}
      .strong{fill:#fff;stroke:#94a3b8;stroke-width:1.5}
      .muted{fill:#f1f5f9}
      .text{fill:#0f172a;font-family:Inter,Segoe UI,Arial,sans-serif}
      .sec{fill:#334155;font-family:Inter,Segoe UI,Arial,sans-serif}
      .hint{fill:#64748b;font-family:Inter,Segoe UI,Arial,sans-serif}
      .accent{fill:#0369a1}
      .soft{fill:#e0f2fe}
      .primary{fill:#1d4ed8}
      .danger{fill:#fff1f2;stroke:#fda4af}
      .title{font-size:30px;font-weight:850}
      .label{font-size:13px;font-weight:850;letter-spacing:.08em}
      .body{font-size:16px;font-weight:750}
      .small{font-size:13px;font-weight:700}
      .mini{font-size:12px;font-weight:800}
      .shadow{filter:url(#s)}
    </style>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity=".07"/>
    </filter>
  </defs>

  <rect class="bg" width="1440" height="1080"/>
  <text x="72" y="64" class="text title">Layout 2 Revised: Filter + Info Inline</text>
  <text x="72" y="94" class="hint body">Panel toolbar tetap satu. Info data dibuat sejajar dengan filter agar area kontrol lebih pendek.</text>

  <g transform="translate(72 130)">
    <rect width="1296" height="104" rx="8" class="panel shadow"/>
    <rect width="5" height="104" rx="3" fill="#0369a1"/>
    <text x="30" y="38" class="accent label">AKADEMIK</text>
    <text x="30" y="76" class="text title">Judul Modul</text>
    <text x="1030" y="60" class="hint small">Panel Header</text>
  </g>

  <g transform="translate(72 252)">
    <rect width="1296" height="58" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <rect x="24" y="12" width="142" height="34" rx="7" class="soft" stroke="#0369a1"/>
    <text x="58" y="34" class="accent small">Tab Aktif</text>
    <rect x="178" y="12" width="142" height="34" rx="7" fill="#fff" stroke="#cbd5e1"/>
    <text x="214" y="34" class="sec small">Tab Kedua</text>
    <rect x="332" y="12" width="142" height="34" rx="7" fill="#fff" stroke="#cbd5e1"/>
    <text x="368" y="34" class="sec small">Tab Ketiga</text>
  </g>

  <g transform="translate(72 332)">
    <rect width="1296" height="166" rx="8" class="panel shadow"/>

    <g transform="translate(24 24)">
      <rect width="1248" height="44" rx="7" class="panel2"/>
      <text x="16" y="28" class="sec small">Toolbar</text>
      <rect x="104" y="6" width="132" height="32" rx="7" class="primary"/>
      <text x="133" y="27" fill="#fff" font-family="Inter,Segoe UI,Arial" font-size="12" font-weight="850">Tambah</text>
      <rect x="248" y="6" width="96" height="32" rx="7" fill="#fff" stroke="#94a3b8"/>
      <text x="273" y="27" class="sec mini">Template</text>
      <rect x="356" y="6" width="86" height="32" rx="7" fill="#fff" stroke="#94a3b8"/>
      <text x="384" y="27" class="sec mini">Import</text>
      <rect x="454" y="6" width="82" height="32" rx="7" class="danger"/>
      <text x="480" y="27" fill="#be123c" font-family="Inter,Segoe UI,Arial" font-size="12" font-weight="850">Reset</text>
      <rect x="548" y="6" width="92" height="32" rx="7" fill="#fff" stroke="#94a3b8"/>
      <text x="572" y="27" class="sec mini">Refresh</text>
      <text x="1064" y="28" class="hint mini">Aksi halaman</text>
    </g>

    <line x1="24" y1="84" x2="1272" y2="84" class="line"/>

    <g transform="translate(24 102)">
      <text x="0" y="26" class="sec small">Filter</text>
      <rect x="72" width="330" height="40" rx="7" fill="#fff" stroke="#94a3b8"/>
      <text x="88" y="26" class="hint small">Cari data...</text>
      <rect x="414" width="152" height="40" rx="7" fill="#fff" stroke="#94a3b8"/>
      <text x="430" y="26" class="sec small">Tingkat</text>
      <rect x="578" width="152" height="40" rx="7" fill="#fff" stroke="#94a3b8"/>
      <text x="594" y="26" class="sec small">Kelas</text>
      <rect x="742" width="150" height="40" rx="7" fill="#fff" stroke="#94a3b8"/>
      <text x="758" y="26" class="sec small">Agama</text>

      <rect x="928" width="296" height="40" rx="7" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="944" y="25" class="text mini">128 data</text>
      <circle cx="1026" cy="20" r="3" fill="#94a3b8"/>
      <text x="1040" y="25" class="hint mini">10 baris / halaman</text>
      <circle cx="1166" cy="20" r="3" fill="#94a3b8"/>
      <text x="1180" y="25" class="accent mini">Aktif</text>
    </g>
  </g>

  <g transform="translate(72 522)">
    <rect width="1296" height="462" rx="8" class="strong shadow"/>
    <rect width="1296" height="52" rx="8" class="muted"/>
    <line x1="0" y1="52" x2="1296" y2="52" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="28" y="33" class="sec small">Kode</text>
    <text x="170" y="33" class="sec small">Nama</text>
    <text x="430" y="33" class="sec small">Keterangan</text>
    <text x="930" y="33" class="sec small">Status</text>
    <text x="1160" y="33" class="sec small">Aksi</text>

    <g transform="translate(0 52)">
      <rect width="1296" height="60" fill="#fff"/>
      <text x="28" y="37" class="text small">001</text>
      <text x="170" y="37" class="text small">Data utama</text>
      <text x="430" y="37" class="text small">Info data sejajar dengan filter sehingga panel toolbar lebih pendek.</text>
      <rect x="920" y="17" width="90" height="26" rx="13" fill="#e0f2fe" stroke="#7dd3fc"/>
      <text x="943" y="35" fill="#0369a1" font-family="Inter,Segoe UI,Arial" font-size="12" font-weight="800">Aktif</text>
      <circle cx="1168" cy="30" r="16" fill="#fff" stroke="#94a3b8"/>
      <circle cx="1212" cy="30" r="16" fill="#fff" stroke="#94a3b8"/>
      <circle cx="1256" cy="30" r="16" fill="#fff" stroke="#94a3b8"/>
    </g>

    <g transform="translate(0 112)">
      <rect width="1296" height="60" fill="#f8fafc"/>
      <text x="28" y="37" class="text small">002</text>
      <text x="170" y="37" class="text small">Data kedua</text>
      <text x="430" y="37" class="text small">Cocok jika info data pendek dan filter tidak terlalu banyak.</text>
      <rect x="920" y="17" width="90" height="26" rx="13" fill="#dcfce7" stroke="#86efac"/>
      <text x="947" y="35" fill="#15803d" font-family="Inter,Segoe UI,Arial" font-size="12" font-weight="800">OK</text>
      <circle cx="1168" cy="30" r="16" fill="#fff" stroke="#94a3b8"/>
      <circle cx="1212" cy="30" r="16" fill="#fff" stroke="#94a3b8"/>
      <circle cx="1256" cy="30" r="16" fill="#fff" stroke="#94a3b8"/>
    </g>

    <g transform="translate(0 172)">
      <rect width="1296" height="60" fill="#fff"/>
      <text x="28" y="37" class="text small">003</text>
      <text x="170" y="37" class="text small">Data ketiga</text>
      <text x="430" y="37" class="text small">Pada mobile, info data bisa turun ke bawah filter agar tetap terbaca.</text>
      <rect x="920" y="17" width="90" height="26" rx="13" fill="#fef3c7" stroke="#fcd34d"/>
      <text x="943" y="35" fill="#b45309" font-family="Inter,Segoe UI,Arial" font-size="12" font-weight="800">Draft</text>
      <circle cx="1168" cy="30" r="16" fill="#fff" stroke="#94a3b8"/>
      <circle cx="1212" cy="30" r="16" fill="#fff" stroke="#94a3b8"/>
      <circle cx="1256" cy="30" r="16" fill="#fff" stroke="#94a3b8"/>
    </g>
  </g>
</svg>

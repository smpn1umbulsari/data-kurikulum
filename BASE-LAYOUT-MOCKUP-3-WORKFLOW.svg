<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120">
  <defs>
    <style>
      .bg{fill:#f6f8fb}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.4}.strong{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.muted{fill:#f1f5f9}.text{fill:#0f172a;font-family:Inter,Segoe UI,Arial,sans-serif}.sec{fill:#334155;font-family:Inter,Segoe UI,Arial,sans-serif}.hint{fill:#64748b;font-family:Inter,Segoe UI,Arial,sans-serif}.accent{fill:#b45309}.soft{fill:#fef3c7}.primary{fill:#1d4ed8}.title{font-size:30px;font-weight:850}.label{font-size:13px;font-weight:850;letter-spacing:.08em}.body{font-size:16px;font-weight:750}.small{font-size:13px;font-weight:700}.tiny{font-size:12px;font-weight:650}.shadow{filter:url(#s)}
    </style>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity=".07"/></filter>
  </defs>
  <rect class="bg" width="1440" height="1120"/>
  <text x="72" y="64" class="text title">Rekomendasi 3: Workflow Workspace Shell</text>
  <text x="72" y="94" class="hint body">Untuk modul kerja aktif: kontrol di kiri, workspace utama di kanan.</text>

  <g transform="translate(72 130)">
    <rect width="1296" height="120" rx="8" class="panel shadow"/><rect width="5" height="120" rx="3" fill="#b45309"/>
    <text x="30" y="38" class="accent label">NILAI / WORKFLOW</text><text x="30" y="76" class="text title">Judul Modul</text>
    <g transform="translate(930 35)"><rect width="150" height="42" rx="7" class="soft" stroke="#b45309"/><text x="42" y="27" class="accent body">Mode 1</text><rect x="162" width="150" height="42" rx="7" fill="#fff" stroke="#cbd5e1"/><text x="207" y="27" class="sec body">Mode 2</text></g>
  </g>

  <g transform="translate(72 274)">
    <rect width="1296" height="76" rx="8" class="panel"/><text x="24" y="31" class="sec small">Action Bar</text>
    <g transform="translate(1040 21)"><rect width="110" height="34" rx="7" fill="#fff" stroke="#94a3b8"/><text x="34" y="23" class="sec small">Export</text><rect x="122" width="120" height="34" rx="7" class="primary"/><text x="157" y="23" fill="#fff" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="800">Simpan</text></g>
  </g>

  <g transform="translate(72 374)">
    <rect width="360" height="650" rx="8" class="panel shadow"/>
    <text x="24" y="34" class="sec body">Control Panel</text>
    <text x="24" y="62" class="hint small">Pilih konteks kerja terlebih dahulu.</text>
    <g transform="translate(24 94)"><text y="0" class="hint tiny">Konteks 1</text><rect y="12" width="312" height="44" rx="7" fill="#fff" stroke="#94a3b8"/><text x="16" y="40" class="sec small">Pilih kelas</text></g>
    <g transform="translate(24 174)"><text y="0" class="hint tiny">Konteks 2</text><rect y="12" width="312" height="44" rx="7" fill="#fff" stroke="#94a3b8"/><text x="16" y="40" class="sec small">Pilih mapel / mode</text></g>
    <g transform="translate(24 254)"><text y="0" class="hint tiny">Pencarian</text><rect y="12" width="312" height="44" rx="7" fill="#fff" stroke="#94a3b8"/><text x="16" y="40" class="hint small">Cari data...</text></g>
    <rect x="24" y="364" width="312" height="108" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="44" y="396" fill="#b45309" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="850">Status Aktif</text>
    <text x="44" y="424" class="hint small">Draft tersimpan lokal.</text>
    <text x="44" y="450" class="hint small">24 baris siap diproses.</text>
  </g>

  <g transform="translate(456 374)">
    <rect width="912" height="650" rx="8" class="strong shadow"/>
    <rect x="24" y="24" width="864" height="62" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="48" y="62" class="text body">Workspace utama</text>
    <text x="720" y="62" class="hint small">24 data</text>
    <rect x="24" y="110" width="864" height="470" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <rect x="24" y="110" width="864" height="48" rx="8" class="muted"/>
    <text x="48" y="140" class="sec small">Nama</text><text x="360" y="140" class="sec small">Input / Nilai</text><text x="600" y="140" class="sec small">Status</text><text x="760" y="140" class="sec small">Aksi</text>
    <g transform="translate(24 158)"><rect width="864" height="58" fill="#fff"/><text x="24" y="36" class="text small">Ahmad Zaki</text><rect x="324" y="14" width="110" height="32" rx="6" fill="#fff" stroke="#94a3b8"/><text x="366" y="35" class="text small">88</text><rect x="566" y="16" width="86" height="26" rx="13" fill="#dcfce7" stroke="#86efac"/><text x="590" y="34" fill="#15803d" font-family="Inter,Segoe UI,Arial" font-size="12" font-weight="800">OK</text></g>
    <g transform="translate(24 216)"><rect width="864" height="58" fill="#f8fafc"/><text x="24" y="36" class="text small">Bunga Laras</text><rect x="324" y="14" width="110" height="32" rx="6" fill="#fff" stroke="#94a3b8"/><text x="370" y="35" class="text small">-</text><rect x="566" y="16" width="86" height="26" rx="13" fill="#fef3c7" stroke="#fcd34d"/><text x="582" y="34" fill="#b45309" font-family="Inter,Segoe UI,Arial" font-size="12" font-weight="800">Belum</text></g>
  </g>
</svg>

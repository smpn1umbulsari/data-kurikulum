<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120">
  <defs>
    <style>
      .bg{fill:#f6f8fb}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.4}.strong{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.muted{fill:#f1f5f9}.text{fill:#0f172a;font-family:Inter,Segoe UI,Arial,sans-serif}.sec{fill:#334155;font-family:Inter,Segoe UI,Arial,sans-serif}.hint{fill:#64748b;font-family:Inter,Segoe UI,Arial,sans-serif}.accent{fill:#0f766e}.soft{fill:#ccfbf1}.primary{fill:#1d4ed8}.title{font-size:30px;font-weight:850}.label{font-size:13px;font-weight:850;letter-spacing:.08em}.body{font-size:16px;font-weight:750}.small{font-size:13px;font-weight:700}.tiny{font-size:12px;font-weight:650}.shadow{filter:url(#s)}
    </style>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity=".07"/></filter>
  </defs>
  <rect class="bg" width="1440" height="1120"/>
  <text x="72" y="64" class="text title">Layout 1: Tabs Below - Stacked</text>
  <text x="72" y="94" class="hint body">Header bersih, tab di bawah header, lalu tombol cepat, filter, info, workspace.</text>

  <g transform="translate(72 130)">
    <rect width="1296" height="104" rx="8" class="panel shadow"/><rect width="5" height="104" rx="3" fill="#0f766e"/>
    <text x="30" y="38" class="accent label">AKADEMIK</text><text x="30" y="76" class="text title">Judul Modul</text>
    <text x="1010" y="60" class="hint small">Header hanya identitas</text>
  </g>

  <g transform="translate(72 252)">
    <rect width="1296" height="62" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <text x="24" y="38" class="sec small">Tabs</text>
    <rect x="92" y="14" width="142" height="34" rx="7" class="soft" stroke="#0f766e"/><text x="126" y="36" class="accent small">Tab Aktif</text>
    <rect x="246" y="14" width="142" height="34" rx="7" fill="#fff" stroke="#cbd5e1"/><text x="282" y="36" class="sec small">Tab Kedua</text>
    <rect x="400" y="14" width="142" height="34" rx="7" fill="#fff" stroke="#cbd5e1"/><text x="436" y="36" class="sec small">Tab Ketiga</text>
  </g>

  <g transform="translate(72 332)">
    <rect width="1296" height="82" rx="8" class="panel"/><text x="24" y="30" class="sec small">Action Bar</text>
    <g transform="translate(24 42)"><rect width="130" height="34" rx="7" class="primary"/><text x="31" y="23" fill="#fff" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="800">Aksi Utama</text><rect x="146" width="110" height="34" rx="7" fill="#fff" stroke="#94a3b8"/><text x="178" y="23" class="sec small">Template</text><rect x="268" width="110" height="34" rx="7" fill="#fff" stroke="#94a3b8"/><text x="300" y="23" class="sec small">Import</text><rect x="390" width="110" height="34" rx="7" fill="#fff" stroke="#94a3b8"/><text x="422" y="23" class="sec small">Reset</text><rect x="512" width="110" height="34" rx="7" fill="#fff" stroke="#94a3b8"/><text x="538" y="23" class="sec small">Refresh</text></g>
  </g>

  <g transform="translate(72 438)">
    <rect width="1296" height="120" rx="8" class="panel"/><text x="24" y="30" class="sec small">Control Panel</text>
    <g transform="translate(24 50)"><rect width="440" height="44" rx="7" fill="#fff" stroke="#94a3b8"/><text x="16" y="28" class="hint small">Cari data...</text><rect x="464" width="230" height="44" rx="7" fill="#fff" stroke="#94a3b8"/><text x="480" y="28" class="sec small">Filter 1</text><rect x="718" width="230" height="44" rx="7" fill="#fff" stroke="#94a3b8"/><text x="734" y="28" class="sec small">Filter 2</text><rect x="972" width="252" height="44" rx="7" fill="#fff" stroke="#94a3b8"/><text x="988" y="28" class="sec small">Filter 3</text></g>
  </g>

  <g transform="translate(72 582)"><rect width="1296" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="24" y="36" class="text body">128 data</text><text x="1050" y="36" class="hint small">Rows per page: 10</text></g>

  <g transform="translate(72 664)">
    <rect width="1296" height="360" rx="8" class="strong shadow"/><rect width="1296" height="52" rx="8" class="muted"/><line x1="0" y1="52" x2="1296" y2="52" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="28" y="33" class="sec small">Kolom 1</text><text x="230" y="33" class="sec small">Kolom 2</text><text x="470" y="33" class="sec small">Deskripsi</text><text x="960" y="33" class="sec small">Status</text><text x="1160" y="33" class="sec small">Aksi</text>
    <g transform="translate(0 52)"><rect width="1296" height="58" fill="#fff"/><text x="28" y="36" class="text small">001</text><text x="230" y="36" class="text small">Kode</text><text x="470" y="36" class="text small">Contoh data utama</text><rect x="950" y="16" width="90" height="26" rx="13" fill="#dcfce7" stroke="#86efac"/><text x="972" y="34" fill="#15803d" font-family="Inter,Segoe UI,Arial" font-size="12" font-weight="800">Aktif</text><circle cx="1178" cy="29" r="15" fill="#fff" stroke="#94a3b8"/><circle cx="1220" cy="29" r="15" fill="#fee2e2" stroke="#fca5a5"/></g>
    <g transform="translate(0 110)"><rect width="1296" height="58" fill="#f8fafc"/><text x="28" y="36" class="text small">002</text><text x="230" y="36" class="text small">Kode</text><text x="470" y="36" class="text small">Contoh data kedua</text><rect x="950" y="16" width="90" height="26" rx="13" fill="#fef3c7" stroke="#fcd34d"/><text x="972" y="34" fill="#b45309" font-family="Inter,Segoe UI,Arial" font-size="12" font-weight="800">Draft</text><circle cx="1178" cy="29" r="15" fill="#fff" stroke="#94a3b8"/><circle cx="1220" cy="29" r="15" fill="#fee2e2" stroke="#fca5a5"/></g>
  </g>
</svg>

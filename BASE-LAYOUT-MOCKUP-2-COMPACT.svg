<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120">
  <defs>
    <style>
      .bg{fill:#f6f8fb}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:1.4}.strong{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.muted{fill:#f1f5f9}.text{fill:#0f172a;font-family:Inter,Segoe UI,Arial,sans-serif}.sec{fill:#334155;font-family:Inter,Segoe UI,Arial,sans-serif}.hint{fill:#64748b;font-family:Inter,Segoe UI,Arial,sans-serif}.accent{fill:#0369a1}.soft{fill:#e0f2fe}.primary{fill:#1d4ed8}.title{font-size:30px;font-weight:850}.label{font-size:13px;font-weight:850;letter-spacing:.08em}.body{font-size:16px;font-weight:750}.small{font-size:13px;font-weight:700}.tiny{font-size:12px;font-weight:650}.shadow{filter:url(#s)}
    </style>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity=".07"/></filter>
  </defs>
  <rect class="bg" width="1440" height="1120"/>
  <text x="72" y="64" class="text title">Rekomendasi 2: Compact Header Shell</text>
  <text x="72" y="94" class="hint body">Lebih hemat ruang: header, tab, dan tombol cepat dibuat padat tetapi tetap terbaca.</text>

  <g transform="translate(72 130)">
    <rect width="1296" height="156" rx="8" class="panel shadow"/><rect width="5" height="156" rx="3" fill="#0369a1"/>
    <text x="30" y="38" class="accent label">AKADEMIK</text><text x="30" y="76" class="text title">Judul Modul</text>
    <g transform="translate(30 102)"><rect width="130" height="34" rx="7" class="primary"/><text x="31" y="23" fill="#fff" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="800">Aksi Utama</text><rect x="146" width="100" height="34" rx="7" fill="#fff" stroke="#94a3b8"/><text x="174" y="23" class="sec small">Import</text><rect x="258" width="100" height="34" rx="7" fill="#fff" stroke="#94a3b8"/><text x="286" y="23" class="sec small">Reset</text><rect x="370" width="100" height="34" rx="7" fill="#fff" stroke="#94a3b8"/><text x="394" y="23" class="sec small">Refresh</text></g>
    <g transform="translate(930 36)"><rect width="150" height="42" rx="7" class="soft" stroke="#0369a1"/><text x="42" y="27" class="accent body">Tab Aktif</text><rect x="162" width="150" height="42" rx="7" fill="#fff" stroke="#cbd5e1"/><text x="203" y="27" class="sec body">Tab Lain</text></g>
  </g>

  <g transform="translate(72 310)">
    <rect width="1296" height="116" rx="8" class="panel"/><text x="24" y="30" class="sec small">Control Panel</text>
    <g transform="translate(24 50)"><rect width="520" height="44" rx="7" fill="#fff" stroke="#94a3b8"/><text x="16" y="28" class="hint small">Cari data...</text><rect x="544" width="210" height="44" rx="7" fill="#fff" stroke="#94a3b8"/><text x="560" y="28" class="sec small">Filter 1</text><rect x="766" width="210" height="44" rx="7" fill="#fff" stroke="#94a3b8"/><text x="782" y="28" class="sec small">Filter 2</text><rect x="988" width="236" height="44" rx="7" fill="#fff" stroke="#94a3b8"/><text x="1004" y="28" class="sec small">Filter 3</text></g>
  </g>

  <g transform="translate(72 450)"><rect width="1296" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="24" y="36" class="text body">128 data</text><text x="1050" y="36" class="hint small">Rows per page: 10</text></g>

  <g transform="translate(72 532)">
    <rect width="1296" height="492" rx="8" class="strong shadow"/><rect width="1296" height="52" rx="8" class="muted"/><line x1="0" y1="52" x2="1296" y2="52" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="28" y="33" class="sec small">Kolom 1</text><text x="230" y="33" class="sec small">Kolom 2</text><text x="470" y="33" class="sec small">Deskripsi Utama</text><text x="950" y="33" class="sec small">Status</text><text x="1160" y="33" class="sec small">Aksi</text>
    <g transform="translate(0 52)"><rect width="1296" height="62" fill="#fff"/><text x="28" y="38" class="text small">001</text><text x="230" y="38" class="text small">Kode</text><text x="470" y="38" class="text small">Workspace lebih cepat terlihat karena header compact</text><rect x="940" y="18" width="90" height="26" rx="13" fill="#e0f2fe" stroke="#7dd3fc"/><text x="962" y="36" fill="#0369a1" font-family="Inter,Segoe UI,Arial" font-size="12" font-weight="800">Aktif</text><circle cx="1178" cy="31" r="15" fill="#fff" stroke="#94a3b8"/><circle cx="1220" cy="31" r="15" fill="#fee2e2" stroke="#fca5a5"/></g>
    <g transform="translate(0 114)"><rect width="1296" height="62" fill="#f8fafc"/><text x="28" y="38" class="text small">002</text><text x="230" y="38" class="text small">Kode</text><text x="470" y="38" class="text small">Cocok untuk modul dengan tombol tidak terlalu banyak</text><rect x="940" y="18" width="90" height="26" rx="13" fill="#dcfce7" stroke="#86efac"/><text x="962" y="36" fill="#15803d" font-family="Inter,Segoe UI,Arial" font-size="12" font-weight="800">OK</text><circle cx="1178" cy="31" r="15" fill="#fff" stroke="#94a3b8"/><circle cx="1220" cy="31" r="15" fill="#fee2e2" stroke="#fca5a5"/></g>
  </g>
</svg>

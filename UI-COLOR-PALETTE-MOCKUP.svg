<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <style>
      .bg{fill:#f6f8fb}
      .surface{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}
      .muted{fill:#f1f5f9}
      .text{fill:#0f172a;font-family:Inter,Segoe UI,Arial,sans-serif}
      .secondary{fill:#334155;font-family:Inter,Segoe UI,Arial,sans-serif}
      .hint{fill:#64748b;font-family:Inter,Segoe UI,Arial,sans-serif}
      .label{font-size:20px;font-weight:800}
      .small{font-size:15px;font-weight:650}
      .tiny{font-size:13px;font-weight:650}
      .title{font-size:34px;font-weight:850}
      .subtitle{font-size:17px;font-weight:600}
      .code{font-size:14px;font-weight:750}
      .shadow{filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity=".08"/>
    </filter>
  </defs>

  <rect class="bg" width="1600" height="1100"/>

  <text x="70" y="74" class="text title">Rekomendasi Warna UI: Clean, Tegas, Mudah Dibaca</text>
  <text x="70" y="108" class="hint subtitle">Gunakan warna sebagai aksen batas dan orientasi modul, bukan sebagai background besar.</text>

  <g transform="translate(70 150)">
    <rect class="surface shadow" rx="8" width="1460" height="250"/>
    <text x="28" y="42" class="text label">1. Core System Palette</text>
    <text x="28" y="70" class="hint small">Netral tetap dominan agar aplikasi terasa ringan dan profesional.</text>
    <g transform="translate(28 105)">
      <g>
        <rect width="128" height="82" rx="8" fill="#f6f8fb" stroke="#cbd5e1"/>
        <text x="12" y="112" class="secondary tiny">App BG</text>
        <text x="12" y="132" class="hint code">#F6F8FB</text>
      </g>
      <g transform="translate(158 0)">
        <rect width="128" height="82" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="12" y="112" class="secondary tiny">Surface</text>
        <text x="12" y="132" class="hint code">#FFFFFF</text>
      </g>
      <g transform="translate(316 0)">
        <rect width="128" height="82" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
        <text x="12" y="112" class="secondary tiny">Muted</text>
        <text x="12" y="132" class="hint code">#F1F5F9</text>
      </g>
      <g transform="translate(474 0)">
        <rect width="128" height="82" rx="8" fill="#cbd5e1"/>
        <text x="12" y="112" class="secondary tiny">Border</text>
        <text x="12" y="132" class="hint code">#CBD5E1</text>
      </g>
      <g transform="translate(632 0)">
        <rect width="128" height="82" rx="8" fill="#94a3b8"/>
        <text x="12" y="112" class="secondary tiny">Strong Line</text>
        <text x="12" y="132" class="hint code">#94A3B8</text>
      </g>
      <g transform="translate(790 0)">
        <rect width="128" height="82" rx="8" fill="#0f172a"/>
        <text x="12" y="112" class="secondary tiny">Text</text>
        <text x="12" y="132" class="hint code">#0F172A</text>
      </g>
      <g transform="translate(948 0)">
        <rect width="128" height="82" rx="8" fill="#1d4ed8"/>
        <text x="12" y="112" class="secondary tiny">Primary</text>
        <text x="12" y="132" class="hint code">#1D4ED8</text>
      </g>
    </g>
  </g>

  <g transform="translate(70 440)">
    <rect class="surface shadow" rx="8" width="705" height="585"/>
    <text x="28" y="42" class="text label">2. Module Accent Mapping</text>
    <text x="28" y="70" class="hint small">Aksen dipakai untuk border kiri, active tab, badge, dan icon.</text>

    <g transform="translate(28 105)">
      <g>
        <rect width="315" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
        <rect width="6" height="64" rx="3" fill="#0f766e"/>
        <circle cx="34" cy="32" r="13" fill="#ccfbf1" stroke="#0f766e"/>
        <text x="58" y="27" class="text small">Siswa / Akademik</text>
        <text x="58" y="48" class="hint code">#0F766E + #CCFBF1</text>
      </g>
      <g transform="translate(345 0)">
        <rect width="315" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
        <rect width="6" height="64" rx="3" fill="#4338ca"/>
        <circle cx="34" cy="32" r="13" fill="#e0e7ff" stroke="#4338ca"/>
        <text x="58" y="27" class="text small">Guru / Mengajar</text>
        <text x="58" y="48" class="hint code">#4338CA + #E0E7FF</text>
      </g>

      <g transform="translate(0 82)">
        <rect width="315" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
        <rect width="6" height="64" rx="3" fill="#15803d"/>
        <circle cx="34" cy="32" r="13" fill="#dcfce7" stroke="#15803d"/>
        <text x="58" y="27" class="text small">Kelas / Wali Kelas</text>
        <text x="58" y="48" class="hint code">#15803D + #DCFCE7</text>
      </g>
      <g transform="translate(345 82)">
        <rect width="315" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
        <rect width="6" height="64" rx="3" fill="#0369a1"/>
        <circle cx="34" cy="32" r="13" fill="#e0f2fe" stroke="#0369a1"/>
        <text x="58" y="27" class="text small">Mapel / Kurikulum</text>
        <text x="58" y="48" class="hint code">#0369A1 + #E0F2FE</text>
      </g>

      <g transform="translate(0 164)">
        <rect width="315" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
        <rect width="6" height="64" rx="3" fill="#b45309"/>
        <circle cx="34" cy="32" r="13" fill="#fef3c7" stroke="#b45309"/>
        <text x="58" y="27" class="text small">Nilai / Rapor</text>
        <text x="58" y="48" class="hint code">#B45309 + #FEF3C7</text>
      </g>
      <g transform="translate(345 164)">
        <rect width="315" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
        <rect width="6" height="64" rx="3" fill="#7c3aed"/>
        <circle cx="34" cy="32" r="13" fill="#f3e8ff" stroke="#7c3aed"/>
        <text x="58" y="27" class="text small">Asesmen</text>
        <text x="58" y="48" class="hint code">#7C3AED + #F3E8FF</text>
      </g>

      <g transform="translate(0 246)">
        <rect width="315" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
        <rect width="6" height="64" rx="3" fill="#c2410c"/>
        <circle cx="34" cy="32" r="13" fill="#ffedd5" stroke="#c2410c"/>
        <text x="58" y="27" class="text small">Rekap / Tugas</text>
        <text x="58" y="48" class="hint code">#C2410C + #FFEDD5</text>
      </g>
      <g transform="translate(345 246)">
        <rect width="315" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
        <rect width="6" height="64" rx="3" fill="#334155"/>
        <circle cx="34" cy="32" r="13" fill="#f1f5f9" stroke="#334155"/>
        <text x="58" y="27" class="text small">Admin / Utility</text>
        <text x="58" y="48" class="hint code">#334155 + #F1F5F9</text>
      </g>
    </g>

    <g transform="translate(28 475)">
      <rect width="660" height="70" rx="8" fill="#fff7f7" stroke="#fecaca"/>
      <rect width="6" height="70" rx="3" fill="#b91c1c"/>
      <text x="24" y="28" class="text small">Status warna tetap universal</text>
      <text x="24" y="50" class="hint tiny">Hapus/error selalu merah, sukses hijau, warning amber. Jangan ditukar dengan warna modul.</text>
    </g>
  </g>

  <g transform="translate(825 440)">
    <rect class="surface shadow" rx="8" width="705" height="585"/>
    <text x="28" y="42" class="text label">3. Contoh Penerapan pada Layout</text>
    <text x="28" y="70" class="hint small">Warna membantu orientasi, sedangkan border dan spacing membuat batas tegas.</text>

    <g transform="translate(28 104)">
      <rect width="650" height="420" rx="8" fill="#f6f8fb" stroke="#cbd5e1"/>
      <rect x="24" y="24" width="602" height="76" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <rect x="24" y="24" width="5" height="76" rx="3" fill="#b45309"/>
      <text x="48" y="52" class="hint tiny" fill="#b45309">NILAI</text>
      <text x="48" y="78" class="text label">Input Nilai</text>
      <rect x="494" y="44" width="108" height="34" rx="6" fill="#1d4ed8"/>
      <text x="524" y="66" fill="#fff" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="800">Simpan</text>

      <rect x="24" y="118" width="602" height="82" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <rect x="24" y="118" width="602" height="3" rx="2" fill="#b45309"/>
      <rect x="48" y="146" width="170" height="34" rx="6" fill="#ffffff" stroke="#94a3b8"/>
      <text x="64" y="168" class="hint tiny">Kelas: 7A</text>
      <rect x="232" y="146" width="170" height="34" rx="6" fill="#ffffff" stroke="#94a3b8"/>
      <text x="248" y="168" class="hint tiny">Mapel: IPA</text>
      <rect x="416" y="146" width="118" height="34" rx="6" fill="#fef3c7" stroke="#fcd34d"/>
      <text x="438" y="168" fill="#92400e" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="800">Draft aktif</text>

      <rect x="24" y="218" width="602" height="178" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
      <rect x="24" y="218" width="602" height="40" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="48" y="243" class="secondary tiny">No</text>
      <text x="96" y="243" class="secondary tiny">Nama Siswa</text>
      <text x="350" y="243" class="secondary tiny">Nilai</text>
      <text x="492" y="243" class="secondary tiny">Status</text>
      <line x1="24" y1="258" x2="626" y2="258" stroke="#94a3b8"/>
      <text x="48" y="291" class="text tiny">1</text>
      <text x="96" y="291" class="text tiny">Ahmad Zaki</text>
      <rect x="338" y="272" width="72" height="30" rx="6" fill="#fff" stroke="#94a3b8"/>
      <text x="360" y="292" class="text tiny">88</text>
      <rect x="482" y="272" width="86" height="28" rx="14" fill="#dcfce7" stroke="#86efac"/>
      <text x="505" y="291" fill="#15803d" font-family="Inter,Segoe UI,Arial" font-size="12" font-weight="800">OK</text>
      <line x1="24" y1="316" x2="626" y2="316" stroke="#e2e8f0"/>
      <text x="48" y="349" class="text tiny">2</text>
      <text x="96" y="349" class="text tiny">Bunga Laras</text>
      <rect x="338" y="330" width="72" height="30" rx="6" fill="#fff" stroke="#94a3b8"/>
      <text x="360" y="350" class="text tiny">-</text>
      <rect x="482" y="330" width="86" height="28" rx="14" fill="#fef3c7" stroke="#fcd34d"/>
      <text x="498" y="349" fill="#b45309" font-family="Inter,Segoe UI,Arial" font-size="12" font-weight="800">Belum</text>
    </g>
  </g>
</svg>
